[extend]
useDefault = true

[[rules]]
id = "bgu-internal-ip"
description = "BGU internal IP (132.72.x.x)"
regex = '''132\.72\.\d{1,3}\.\d{1,3}'''

[[rules]]
id = "bgu-domain"
description = "BGU domain name"
regex = '''[A-Za-z0-9._-]*bgu\.ac\.il'''

[[rules]]
id = "cluster-hostnames"
description = "Cluster hostnames"
regex = '''\b(hpc-master\d*|ece-hpc|hpc-monitor\d*|hpc-node\d+|hpc-adrian\d*|hpc-apps\d*|hpc-vilenchik|hpc-permuter\d*|truenas\d*|ee-ansible)\b'''

[[rules]]
id = "service-account"
description = "Service account username"
regex = '''\bprofadmin\b'''

[[rules]]
id = "personal-usernames"
description = "Cluster usernames / personal identifiers"
regex = '''\b(rulevich|kamanad|vill?enchik|adrian)\b'''
